services:

  redis:
    build: ./redis
    restart: unless-stopped
    environment:
      - TZ=America/Monterrey
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    environment:
      - TZ=America/Monterrey
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs

volumes:
  redis-data:
